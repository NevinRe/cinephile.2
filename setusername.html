<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Set Username - Cinephile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #141414;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .header {
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #e50914;
        }

        .content {
            padding: 100px 20px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e50914;
        }

        .avatar-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .avatar-option {
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .avatar-option img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .avatar-option.selected img {
            border-color: white;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .save-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .save-btn:hover {
            background: #f40612;
        }

        .success-message {
            background: #28a745;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="header">
        <h1>CINEPHILE</h1>           
    </div>

    <div class="container">
        <h2>Enter Username</h2>
        <form id="user-form">
            <div class="form-group">
                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label>Select Avatar</label>
                <div class="avatar-options" id="avatarOptions">
                    <!-- Avatar options will be inserted here -->
                </div>
            </div>

            <button type="submit" class="save-btn">Save</button>
        </form>

        <p id="successMessage" class="success-message">Profile saved successfully!</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const avatarSeeds = ['Felix', 'John', 'Jane', 'Mike', 'Sarah', 'David', 'Emma', 'Alex'];
            const avatarOptions = document.getElementById('avatarOptions');

            let selectedAvatar = null;

            // Generate avatar options dynamically
            avatarSeeds.forEach(seed => {
                const option = document.createElement('div');
                option.className = 'avatar-option';
                option.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}" alt="Avatar ${seed}">`;
                
                option.onclick = () => {
                    selectedAvatar = seed;
                    document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
                    option.classList.add('selected');
                };

                avatarOptions.appendChild(option);
            });

            document.getElementById('user-form').addEventListener('submit', async (event) => {
                event.preventDefault();
                const username = document.getElementById('username').value.trim();

                if (!username) {
                    alert('Please enter a username.');
                    return;
                }
                if (!selectedAvatar) {
                    alert('Please select an avatar.');
                    return;
                }

                const userData = {
                    username: username,
                    avatarSeed: selectedAvatar
                };

                try {
                    // Save to backend database
                    const response = await fetch('/api/saveUser', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(userData)
                    });

                    if (!response.ok) throw new Error('Failed to save user data');

                    // Show success message
                    document.getElementById('successMessage').style.display = 'block';
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 2000);
                } catch (error) {
                    alert('Error saving user data: ' + error.message);
                }
            });
        });
    </script>
</body>
</html>
